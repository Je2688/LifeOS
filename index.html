<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No Distractions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<style>
/* ===== Design tokens ===== */
:root{--bg:#f3f7f4;--bg2:#e6efe9;--card:#fff;--ink:#0f1f16;--mute:#5f7568;--line:#dbe6df;--acc:#12a150;--acc-t:#e1f5e9;--onacc:#fff;--sun:#e0932b;--gold:#8a6d1c;--cream:#fbf7ea;--goldl:#ebdfb7;--sh:0 12px 32px -18px rgba(10,60,30,.35)}
[data-theme=dark]{color-scheme:dark;--bg:#060a07;--bg2:#0b120d;--card:#0e1610;--ink:#e8f4ec;--mute:#85a08f;--line:#1b2b20;--acc:#2ddc79;--acc-t:#10291a;--onacc:#04130a;--sun:#e6a84a;--gold:#7ee2a4;--cream:#0f1d14;--goldl:#16422a;--sh:0 12px 32px -18px #000}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);line-height:1.5;display:flex;min-height:100vh;background:radial-gradient(900px 520px at 85% -5%,var(--acc-t),transparent 70%),var(--bg);background-attachment:fixed}
h1,h2,.big,.verse p{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em}
h2{font-size:42px;line-height:1.1;margin:0 0 4px}h3{margin:0 0 10px;font-size:17px}
.mute{color:var(--mute);font-size:14px}.sub{color:var(--mute);margin:0 0 22px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700;margin-bottom:6px}
/* ===== Layout ===== */
nav{width:232px;padding:26px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px;flex-shrink:0;border-right:1px solid var(--line);background:color-mix(in srgb,var(--card) 70%,transparent);backdrop-filter:blur(8px)}
nav h1{font-size:23px;margin:0 0 18px 10px;line-height:1.1}nav h1 span{color:var(--acc)}
nav button{font:inherit;display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--mute);padding:10px 12px;border-radius:12px;cursor:pointer;font-weight:500;text-align:left}
nav button:hover{background:var(--acc-t)}nav button.on{background:var(--acc-t);color:var(--acc);font-weight:700}
nav .sp{flex:1}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
main{flex:1;min-width:0;max-width:980px;padding:44px 40px 90px}
section{display:none}section.on{display:block;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.g{display:grid;gap:16px;margin-bottom:16px}.g5{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--sh)}
.g .card,.card.mb{margin:0}section>.card{margin-bottom:16px}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.big{font-size:36px;line-height:1}
/* ===== Controls ===== */
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px;max-width:100%}
textarea{width:100%;min-height:84px;resize:vertical}input[type=range]{padding:0;accent-color:var(--acc)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn{font:inherit;font-weight:700;background:var(--acc);color:var(--onacc);border:0;border-radius:12px;padding:10px 16px;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}.btn.ghost{background:var(--acc-t);color:var(--acc)}.btn.sm{padding:8px 12px}.btn:disabled{opacity:.5}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:17px;padding:2px 8px;border-radius:8px}.x:hover:not(:disabled){background:var(--acc-t);color:var(--ink)}.x:disabled{opacity:.25}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>input[type=text],.row>input:not([type]){flex:1;min-width:140px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.item:first-of-type{border-top:0}.item .name{flex:1;min-width:0}
.tin{flex:1;min-width:0;background:none;border:0;border-bottom:1px solid transparent;border-radius:0;padding:4px 2px}.tin:focus{border-color:var(--line)}.dn{text-decoration:line-through;color:var(--mute)}
.chk{appearance:none;-webkit-appearance:none;width:26px;height:26px;flex-shrink:0;border:2px solid var(--line);border-radius:50%;display:grid;place-content:center;background:var(--card);cursor:pointer;padding:0;transition:.2s}
.chk:checked{background:var(--acc);border-color:var(--acc)}.chk:checked::after{content:"";width:6px;height:11px;border:solid var(--onacc);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
@keyframes pop{50%{transform:scale(1.3)}}@media(prefers-reduced-motion:no-preference){.chk:checked{animation:pop .3s}.card{transition:transform .2s}.card:hover{transform:translateY(-2px)}}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{font:inherit;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--mute);cursor:pointer}.tabs button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.empty{color:var(--mute);padding:6px 0}
/* ===== Data viz ===== */
.oc{display:flex;gap:14px;align-items:center;padding:16px}.oc b{font-size:15px}
.ring{--p:0;position:relative;width:62px;height:62px;border-radius:50%;flex-shrink:0;display:grid;place-content:center;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line) 0);font-weight:700;font-size:13px}
.ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--card)}.ring span{position:relative}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px;border-bottom:1px solid var(--line)}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px;color:var(--mute)}
.bar div{width:100%;border-radius:8px 8px 0 0;min-height:3px;background:linear-gradient(var(--acc),color-mix(in srgb,var(--acc) 50%,transparent));transition:height .5s}.bar.low div{background:var(--sun)}.bar b{color:var(--ink);margin-bottom:3px}
.days{display:flex;gap:8px;margin-top:6px}.days span{flex:1;text-align:center;font-size:12px;color:var(--mute)}
.dots{display:flex;gap:4px}.dots i{width:11px;height:11px;border-radius:50%;background:var(--line)}.dots i.d{background:var(--acc)}
.prog{height:9px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}.prog div{height:100%;background:var(--acc);transition:width .4s}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.cal em{font-style:normal;color:var(--mute)}.cal b{font-weight:500;aspect-ratio:1;display:grid;place-content:center;border-radius:8px;background:color-mix(in srgb,var(--acc) calc(var(--a)*100%),var(--bg2))}
.cal b.td{outline:2px solid var(--acc)}.cal b.ac{box-shadow:inset 0 0 0 2px var(--acc)}
.streak{font-size:36px}
.verse{background:linear-gradient(135deg,var(--cream),var(--card));border-color:var(--goldl)}.verse p{font-size:24px;line-height:1.35;margin:4px 0 10px}.verse h3{color:var(--gold);font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin:0}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.qa button{font:inherit;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:10px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--card);cursor:pointer;box-shadow:var(--sh)}.qa button:hover{border-color:var(--acc)}.qa svg{color:var(--acc)}
.moods{display:flex;gap:8px}.moods button{font-size:24px;background:var(--bg);border:2px solid transparent;border-radius:12px;padding:5px 9px;cursor:pointer}.moods button.on{border-color:var(--acc);background:var(--acc-t)}
.win{display:inline-block;background:var(--acc-t);color:var(--acc);font-weight:700;border-radius:999px;padding:3px 10px;font-size:13px;animation:pop .6s}
/* ===== Overlays ===== */
.ov{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}.ov[hidden]{display:none}
.box{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;max-width:420px;width:100%;box-shadow:var(--sh)}.box h1{font-size:32px;margin:0 0 8px;line-height:1.1}.box h1 span{color:var(--acc)}
.box label{display:block;margin-bottom:12px;font-weight:600}.box input:not([type=checkbox]),.box select{width:100%;margin-top:4px}.box .cr{display:flex;gap:10px;font-weight:400;font-size:14px}
.link{background:none;border:0;color:var(--acc);font:inherit;cursor:pointer;padding:6px 0}
#ftime{font-family:Fraunces,serif;font-size:76px;text-align:center;margin:10px 0}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.3s;z-index:40;max-width:90vw}#toast.on{opacity:1;transform:translate(-50%,0)}
/* ===== Responsive ===== */
@media(max-width:900px){body{flex-direction:column}
nav{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;flex-direction:row;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border:0;border-top:1px solid var(--line);background:var(--card);z-index:20;gap:2px}
nav h1,nav .sp{display:none}nav button{flex:1 0 62px;flex-direction:column;gap:3px;font-size:11px;padding:8px 4px;justify-content:center;align-items:center;text-align:center}
main{padding:26px 16px 110px}h2{font-size:32px}.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav id="nav" aria-label="Sections"></nav>
<main>
<section id="today"></section><section id="sleep"></section><section id="routines"></section><section id="goals"></section><section id="faith"></section><section id="journal"></section><section id="data"></section>
</main>
<div class="ov" id="welcome" hidden></div>
<div class="ov" id="fm" hidden><div class="box"><h3>Focus session</h3><div id="ftime">25:00</div>
 <div class="row" style="justify-content:center"><select id="fdur" aria-label="Minutes"><option value="15">15 min</option><option value="25" selected>25 min</option><option value="50">50 min</option></select><button class="btn" id="fstart">Start</button><button class="btn ghost" id="freset">Reset</button><button class="btn ghost" id="fclose">Close</button></div>
 <p class="mute" style="text-align:center">Completed sessions count toward today's productivity.</p></div></div>
<div id="toast" role="status"></div>

<script>
"use strict";
/* ===== Config (optional email via emailjs.com, optional sign-up list via formspree.io) ===== */
const EMAILJS={service:"",template:"",key:""},FORM_ENDPOINT="";
/* ===== Helpers ===== */
const KEY="lifeos.v1",$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,"0"),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,today=()=>iso(new Date());
const addDays=(k,n)=>{const d=new Date(k+"T12:00");d.setDate(d.getDate()+n);return iso(d)};
const last=n=>[...Array(n)].map((_,i)=>addDays(today(),i-n+1));
const uid=()=>Math.random().toString(36).slice(2,9),hrs=m=>(m/60).toFixed(1),dn=k=>new Date(k+"T12:00").toLocaleDateString(undefined,{weekday:"short"});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const IC={today:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',sleep:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',routines:'<path d="M5 12l5 5L20 7"/>',goals:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',faith:'<path d="M12 2v20M6 8h12"/>',journal:'<path d="M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2zM9 7h6"/>',data:'<path d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3zm0 0v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>',focus:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/>',heart:'<path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/>',book:'<path d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-7a3 3 0 0 0-3 3"/>',theme:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'};
const svg=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
const TABS=[["today","Today"],["sleep","Sleep"],["routines","Routines"],["goals","Goals"],["faith","Faith"],["journal","Journal"],["data","Data"]];
const VERSES=[["Philippians 4:13","I can do all things through Christ which strengtheneth me."],["Proverbs 3:5","Trust in the LORD with all thine heart; and lean not unto thine own understanding."],["Psalm 46:1","God is our refuge and strength, a very present help in trouble."],["Joshua 1:9","Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest."],["Isaiah 41:10","Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee; yea, I will help thee; yea, I will uphold thee with the right hand of my righteousness."],["Matthew 6:33","But seek ye first the kingdom of God, and his righteousness; and all these things shall be added unto you."],["Psalm 23:1","The LORD is my shepherd; I shall not want."],["Jeremiah 29:11","For I know the thoughts that I think toward you, saith the LORD, thoughts of peace, and not of evil, to give you an expected end."],["Romans 8:28","And we know that all things work together for good to them that love God, to them who are the called according to his purpose."],["Colossians 3:23","And whatsoever ye do, do it heartily, as to the Lord, and not unto men;"],["Psalm 119:105","Thy word is a lamp unto my feet, and a light unto my path."],["Matthew 11:28","Come unto me, all ye that labour and are heavy laden, and I will give you rest."],["1 Thessalonians 5:17-18","Pray without ceasing. In every thing give thanks: for this is the will of God in Christ Jesus concerning you."],["Galatians 6:9","And let us not be weary in well doing: for in due season we shall reap, if we faint not."]];
const PROMPTS=["What gave you energy today?","What are you proud of this week?","What is weighing on your mind, and what is one small step?","Who made a difference to you lately?","What would make tomorrow a great day?","What did you learn today?","What are you grateful for right now?"];
const MOODS=["😞","😕","😐","🙂","😄"],dayNum=()=>Math.floor(new Date(today()).getTime()/864e5);
const tv=()=>VERSES[dayNum()%VERSES.length];

/* ===== State & storage (same key and shape as before; new fields added) ===== */
const D=()=>({sleep:[],routines:[],goals:[],journal:{},faith:{read:{},prayers:[],grat:{},fav:[]},tasks:{},checkin:{},focus:{},profile:null,pin:null});
let S=D();
function load(o){S=Object.assign(D(),o);S.faith=Object.assign(D().faith,o.faith||{})}
try{const r=localStorage.getItem(KEY);if(r)load(JSON.parse(r))}catch(e){}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2800)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast("Could not save: browser storage is full or blocked. Export a backup.");return false}}
const save=()=>{persist();render()};
let pref=null;try{pref=localStorage.getItem("nd.theme")}catch(e){}
const applyTheme=()=>{document.documentElement.dataset.theme=pref||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")};applyTheme();

/* ===== Derived metrics (all computed from real data) ===== */
const rF=d=>S.routines.length?S.routines.filter(r=>r.done[d]).length/S.routines.length:null;
const tF=d=>{const t=S.tasks[d]||[];return t.length?t.filter(x=>x.d).length/t.length:null};
const score=d=>{const v=[rF(d),tF(d)].filter(x=>x!==null);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*100):null};
const active=d=>S.routines.some(r=>r.done[d])||(S.tasks[d]||[]).some(x=>x.d)||!!S.journal[d]||!!S.faith.read[d]||!!S.faith.grat[d]||S.sleep.some(s=>s.date===d)||!!S.focus[d];
const gp=g=>g.ms&&g.ms.length?Math.round(g.ms.filter(m=>m.d).length/g.ms.length*100):(g.p||0);
function streaks(){const ks=new Set([...Object.keys(S.journal),...Object.keys(S.faith.read),...Object.keys(S.faith.grat),...Object.keys(S.focus),...Object.keys(S.tasks),...S.sleep.map(s=>s.date),...S.routines.flatMap(r=>Object.keys(r.done))]);
 let best=0,run=0,prev=null;for(const d of [...ks].filter(active).sort()){run=prev&&addDays(prev,1)===d?run+1:1;best=Math.max(best,run);prev=d}
 let cur=0,d=active(today())?today():addDays(today(),-1);while(active(d)){cur++;d=addDays(d,-1)}return{cur,best}}
const rStreak=r=>{let n=0,d=r.done[today()]?today():addDays(today(),-1);while(r.done[d]){n++;d=addDays(d,-1)}return n};

/* ===== UI state ===== */
let calOff=0,ciTab=new Date().getHours()<17?"m":"e",jdate=today(),jm=0,jn="",jq="";
const openJ=k=>{jdate=k;const e=S.journal[k];jm=e?e.mood:0;jn=e?e.note:""};openJ(today());
const bars=(vals,labels,low=50)=>`<div class="bars">${vals.map(p=>`<div class="bar ${p!==null&&p<low?"low":""}"><b>${p===null?"–":p+"%"}</b><div style="height:${p===null?3:Math.max(p,3)}%"></div></div>`).join("")}</div><div class="days">${labels.map(l=>`<span>${l}</span>`).join("")}</div>`;
const ring=(p,v,l,s)=>`<div class="card oc"><div class="ring" style="--p:${Math.round(p)}"><span>${v}</span></div><div><div class="mute">${l}</div><b>${s}</b></div></div>`;

/* ===== Today ===== */
function renderToday(){
 const T=today(),h=new Date().getHours(),greet=h<12?"Good morning":h<18?"Good afternoon":"Good evening",nm=S.profile?S.profile.name:"friend";
 const R=S.routines,done=R.filter(r=>r.done[T]).length,ls=S.sleep.find(s=>s.date===T)||S.sleep[S.sleep.length-1],lsToday=ls&&ls.date===T;
 const gAvg=S.goals.length?Math.round(S.goals.reduce((a,g)=>a+gp(g),0)/S.goals.length):0,fa=(S.faith.read[T]?1:0)+(S.faith.grat[T]?1:0),sc=score(T),st=streaks(),v=tv();
 const fav=S.faith.fav.some(f=>f.ref===v[0]),tk=S.tasks[T]||[],ci=S.checkin[T]||{},wk=last(7);
 const f=new Date(new Date().getFullYear(),new Date().getMonth()+calOff,1),dim=new Date(f.getFullYear(),f.getMonth()+1,0).getDate();
 let cells="SMTWTFS".split("").map(c=>`<em>${c}</em>`).join("")+"<i></i>".repeat(f.getDay());
 for(let d=1;d<=dim;d++){const k=iso(new Date(f.getFullYear(),f.getMonth(),d)),fr=rF(k);cells+=`<b style="--a:${fr||0}" class="${k===T?"td":""} ${active(k)&&!fr?"ac":""}" title="${k}${fr!==null?" · "+Math.round(fr*100)+"% of habits":""}">${d}</b>`}
 const ydImp=(S.checkin[addDays(T,-1)]||{}).imp,tDone=tk.filter(x=>x.d).length;
 const ciBody=ciTab==="m"?`<label class="mute" for="ciPlan">What would make today great?</label><textarea id="ciPlan">${esc(ci.plan||"")}</textarea>${ydImp?`<p class="mute">Yesterday you wanted to improve: <b>${esc(ydImp)}</b></p>`:""}`
  :`<p>${done||tDone||S.focus[T]?`<span class="win">Today: ${done}/${R.length} habits · ${tDone}/${tk.length} priorities · ${S.focus[T]||0} focus sessions</span>`:'<span class="mute">Nothing completed yet today. That is okay, tomorrow is a fresh start.</span>'}</p>
  <label class="mute" for="ciWin">What went well?</label><textarea id="ciWin">${esc(ci.win||"")}</textarea><label class="mute" for="ciImp">What can you improve tomorrow?</label><textarea id="ciImp">${esc(ci.imp||"")}</textarea>`;
 $("#today").innerHTML=`<div class="eyebrow">${new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"})}</div><h2>${greet}, ${esc(nm)}.</h2><p class="sub">Here is your day at a glance.</p>
 <div class="card verse mb" style="margin-bottom:16px"><div class="ch"><div class="eyebrow">Verse of the day</div><button class="x" data-fav="${esc(v[0])}" aria-label="${fav?"Remove from":"Save to"} favorites" style="${fav?"color:var(--acc)":""}">${fav?"♥":"♡"}</button></div><p>\u201c${esc(v[1])}\u201d</p><h3>${v[0]} · KJV</h3></div>
 <div class="g g5">
  ${ring((R.length?done/R.length:0)*100,`${done}/${R.length}`,"Habits",R.length?Math.round(done/R.length*100)+"% done":"Add a habit")}

 if(d.favx){S.faith.fav=S.faith.fav.filter(f=>f.ref!==d.favx);save()}
 if(t.id==="favadd"){const r=val("#favr").trim(),x=val("#favt").trim();if(r&&x){S.faith.fav.push({ref:r,text:x});save()}}
 if(t.id==="sadd"){const [bh,bm]=val("#bed").split(":").map(Number),[wh,wm]=val("#wake").split(":").map(Number);let m=wh*60+wm-(bh*60+bm);if(m<=0)m+=1440;S.sleep=S.sleep.filter(s=>s.date!==T);S.sleep.push({date:T,mins:m,q:+val("#sq"),bed:val("#bed"),wake:val("#wake")});S.sleep.sort((a,b)=>a.date<b.date?-1:1);save()}
 if(d.sx){S.sleep=S.sleep.filter(s=>s.date!==d.sx);save()}
 if(t.id==="radd"){const n=val("#rname").trim();if(n){S.routines.push({id:uid(),name:n,done:{}});save()}}
 if(d.rx&&confirm("Delete this habit and its history?")){S.routines=S.routines.filter(r=>r.id!==d.rx);save()}
 if(t.id==="gadd"){const n=val("#gname").trim();if(n){S.goals.push({id:uid(),name:n,due:val("#gdue"),p:0,ms:[]});save()}}
 if(d.gx&&confirm("Delete this goal?")){S.goals=S.goals.filter(g=>g.id!==d.gx);save()}
 if(d.ma){const v=val("#ma-"+d.ma).trim(),g=S.goals.find(g=>g.id===d.ma);if(v){(g.ms=g.ms||[]).push({t:v,d:false});save()}}
 if(d.mx){const [id,i]=d.mx.split(":");S.goals.find(g=>g.id===id).ms.splice(+i,1);save()}
 if(t.id==="fread"){S.faith.read[T]=val("#fPass").trim()||"Read";save()}
 if(t.id==="gsave"){const v=val("#gr").trim();if(v)S.faith.grat[T]=v;else delete S.faith.grat[T];save();toast("Saved.")}
 if(t.id==="pradd"){const v=val("#pr").trim();if(v){S.faith.prayers.push({id:uid(),text:v,done:false});save()}}
 if(d.px){S.faith.prayers=S.faith.prayers.filter(p=>p.id!==d.px);save()}
 if(d.m){jm=+d.m;$$("#moods button").forEach(b=>b.classList.toggle("on",+b.dataset.m===jm))}
 if(t.id==="jsave"){const n=val("#jNote").trim();if(jm||n)S.journal[jdate]={mood:jm,note:n};else delete S.journal[jdate];jn=n;save();toast("Saved.")}
 if(t.id==="jdel"&&confirm("Delete this entry?")){delete S.journal[jdate];openJ(jdate);save()}
 if(d.jo){openJ(d.jo);render();scrollTo(0,0)}
 if(t.id==="exp"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));a.download="no-distractions-backup-"+T+".json";a.click()}
 if(t.id==="erase"&&confirm("Erase ALL No Distractions data on this device? Export a backup first.")){S=D();persist();location.reload()}
 if(t.id==="pinSet"){const p=val("#pinNew");if(!/^\d{4,}$/.test(p))return toast("Use at least 4 digits.");const salt=b64(crypto.getRandomValues(new Uint8Array(16)));S.pin={salt,hash:await pinHash(p,salt)};save();toast("PIN saved.")}
 if(t.id==="pinRm"){S.pin=null;save()}
 if(t.id==="editProfile")gate("new");
 if(t.id==="mailMe"){if(!S.profile)return;t.disabled=true;const ok=await sendMail(S.profile.email,S.profile.name,"Your week on No Distractions",summary());t.disabled=false;toast(ok?"Sent. Check your inbox.":"Email is not set up yet, or it failed to send.")}
 if(t.id==="gCancel")$("#welcome").hidden=true;
 if(t.id==="gIn"){const err=$("#gErr");if(S.pin&&await pinHash(val("#gPin"),S.pin.salt)!==S.pin.hash){err.textContent="Wrong PIN.";return}try{sessionStorage.setItem("nd.in","1")}catch(x){}$("#welcome").hidden=true}
 if(t.id==="gGo"){const name=val("#gName").trim(),email=val("#gEmail").trim(),err=m=>{$("#gErr").textContent=m};
  if(!name)return err("Enter your first name.");if(!/^\S+@\S+\.\S+$/.test(email))return err("Enter a valid email address.");if(!$("#gOk").checked)return err("Tick the box to continue.");
  const first=!S.profile;S.profile={name,email,joined:first?T:S.profile.joined};try{sessionStorage.setItem("nd.in","1")}catch(x){}$("#welcome").hidden=true;save();
  if(first){sendMail(email,name,"Welcome to No Distractions","Welcome, "+name+"! Your space for sleep, routines, goals and faith is ready: "+location.href.split("#")[0]);if(FORM_ENDPOINT)fetch(FORM_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({name,email})}).catch(()=>{})}}
});
document.addEventListener("change",e=>{const t=e.target,d=t.dataset,T=T0();
 if(d.chk){const r=S.routines.find(r=>r.id===d.chk);if(t.checked)r.done[T]=1;else delete r.done[T];save()}
 if(d.tk){tasks().find(x=>x.id===d.tk).d=t.checked;save()}
 if(d.te){const x=tasks().find(x=>x.id===d.te),v=t.value.trim();if(v)x.t=v;else S.tasks[T]=tasks().filter(y=>y!==x);save()}
 if(d.rn){const r=S.routines.find(r=>r.id===d.rn),v=t.value.trim();if(v)r.name=v;save()}
 if(d.mk){const [id,i]=d.mk.split(":");S.goals.find(g=>g.id===id).ms[+i].d=t.checked;save()}
 if(d.gp){S.goals.find(g=>g.id===d.gp).p=+t.value;save()}
 if(d.pt){const p=S.faith.prayers.find(p=>p.id===d.pt);p.done=t.checked;p.ans=t.checked?T:"";save()}
 if(t.id==="jdate"&&t.value){openJ(t.value);renderJournal()}
 if(t.id==="fdur"&&!F.run){F.left=+t.value*60;fDraw()}
 if(t.id==="imp"){const f=t.files[0];if(!f)return;f.text().then(x=>{try{const o=JSON.parse(x);if(!o||typeof o!=="object"||!Array.isArray(o.routines||[])||!Array.isArray(o.sleep||[]))throw 0;if(!confirm("Replace all current data with this backup?"))return;load(o);persist();render();toast("Backup restored.")}catch(err){toast("That file is not a valid backup.")}});t.value=""}
});
document.addEventListener("input",e=>{const t=e.target;
 if(t.id==="jq"){jq=t.value;renderJL()}if(t.id==="jNote")jn=t.value;
 if(t.dataset.gp){t.closest(".card").querySelector(".prog div").style.width=t.value+"%"}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="tnew")addTask();if(e.key==="Escape")$("#fm").hidden=true});

/* ===== Start ===== */
render();
let inS=false;try{inS=sessionStorage.getItem("nd.in")==="1"}catch(e){}
if(!S.profile)gate("new");else if(!inS)gate("back");
</script>
</body>
</html>
